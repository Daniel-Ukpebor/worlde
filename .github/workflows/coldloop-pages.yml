name: Publish ColdLoop

on:
  push:
    branches: [main]
    paths:
      - coldloop/**
      - .github/workflows/coldloop-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coldloop-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: coldloop/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: coldloop
      - name: Test simulation
        run: npm test
        working-directory: coldloop
      - name: Build site
        run: npm run build
        working-directory: coldloop
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coldloop/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
